schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: feature-store-lite (#23)
  Program: mlops-data-platform
  Claim: prove historical point-in-time correctness and deterministic online serving before measuring warmed Feast SDK p95.
  Downstream role: mlops-end2end (#21) consumes the named FeatureService; data-quality-checks (#26) protects inputs.
  Source of truth:
    - Use .portfolio/ as the synchronized reuse-kit snapshot.
    - Use project.yaml for the public project contract.
    - Use sdd/ for accepted decisions and release gates.
    - Use openspec/changes/ship-feature-store-lite for the active change.
rules:
  intent:
    - Treat temporal and training-serving correctness as release gates, not secondary metrics.
  portfolio-impact:
    - Reuse artifacts through versioned contracts and benchmark evidence, never source imports.
  architecture-record:
    - Challenge hand-rolled feature stores, framework leakage, Redis-by-default, and unnecessary transport.
  component-pack:
    - Use mlops-data-platform, python-feature-store, and benchmark-harness guidance.
  reuse-delta:
    - Patch reusable feature-store decisions into the kit; keep feature formulas and fixture local.
  benchmark-proof:
    - Preserve query truth, future rows, TTL nulls, online truth, source hash, all samples, signature, image, and failures.
    - Separate first online read and materialization from warmed latency.
    - Aggregate at least three same-image, same-signature runs with the shared harness.
  verification:
    - Verify pure oracle, fake-port substitutability, real Feast integration, no skipped adapter tests, Docker, raw JSON, aggregate, strict validation, and CI.
