[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-store-lite"
version = "1.0.0"
description = "Local-first Feast proof for point-in-time and online feature retrieval"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "feast==0.64.0",
  "pandas==2.3.3",
  "pyarrow==25.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
]

[project.scripts]
feature-store-lite = "feature_store_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
